aid: actionstreamer
name: ActionStreamer
description: 'ActionStreamer is a Cincinnati, Ohio IoT video platform company, founded
  in 2016, that builds wearable and connected-device live streaming technology for
  industrial, public-safety, defense, aerospace/MRO and sports operations. Its ActionSync
  platform manages fleets of smart cameras and body-worn devices, moving live and
  store-and-forward video over Wi-Fi, private 5G, cellular and Starlink links, and
  its IRIS product layers AI object detection and alerting on top. ActionStreamer
  publishes a public developer platform at developer.actionstreamer.com: a 247-operation
  HTTP Web API at api.actionstreamer.com covering devices, device health, events,
  event presets, streams, video and audio clips, images, files, users and API keys,
  authenticated with HMAC-SHA256 request signing, plus a first-party Python library
  distributed on PyPI as "actionstreamer".'
