note: >-
  Error catalog assembled from ActionStreamer's published "Errors and Response Handling" guide and
  cross-checked against the OpenAPI. The specification itself is nearly silent on failure: of 247
  operations, 246 declare only a 200 response and exactly one declares a 400. The catalog below is
  therefore the docs' list, not a spec derivation, and it is short because the provider's own list
  is short.
