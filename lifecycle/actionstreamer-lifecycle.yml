maturity:
  assessment: production
  reasoning: >-
    A 247-operation v1 surface, a portal issuing production API keys, a 251-release first-party SDK
    shipping weekly, and named enterprise/defense deployments in the company's own blog. The
    contract is real and in service; what is missing is the operational scaffolding around it.
recommendations:
- Publish a status page and link it from the developer portal.
- Publish a versioning and deprecation policy, and adopt the Deprecation and Sunset headers (RFC 8594).
- Publish a dated API changelog distinct from the SDK release history.
