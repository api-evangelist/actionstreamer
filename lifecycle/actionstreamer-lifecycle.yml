note: >-
  Lifecycle posture searched across the developer portal, the corporate site sitemap (231 URLs) and
  the OpenAPI. ActionStreamer publishes a versioned API and an actively released SDK, but no
  versioning policy, no deprecation policy, no status page and no SLA. Absences below were probed,
  not assumed.
versioning:
  scheme: path prefix
  current_version: v1
  spec_version: v1
  spec_publish_date: '2026-07-07T16:13:41Z'
  spec_publish_date_source: 'info.description of the published OpenAPI'
  policy_published: false
  note: >-
    The OpenAPI stamps its own publish date into info.description, which is an unusually honest
    freshness signal — a consumer can tell how old the contract is. There is no semantic version, no
    version history and no second version in service.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No operation in the 247-operation surface carries `deprecated: true`, and no deprecation or
    sunset policy is published. Nothing here is evidence of stability — it is evidence that the
    question has not been addressed publicly.
