          example: Example value
        agentType:
          type:
          - string
          - 'null'
          example: Example value
        agentVersion:
          type:
          - string
          - 'null'
          example: Example value
        agentIndex:
          type:
          - integer
          - 'null'
          format: int64
          example: 1
        processID:
          type:
          - integer
          - 'null'
          format: int64
          example: 1
      additionalProperties: false
      example:
        deviceName: WearableDevice
        deviceSerial: '10001234'
        agentType: Device
        agentVersion: 1.0.0
        agentIndex: 1
        processID: 4321
