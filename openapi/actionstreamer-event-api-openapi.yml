openapi: 3.2.0
info:
  title: ActionStreamer Event API
  description: 'A web API for the ActionStreamer platform. Publish date: 2026-07-07 16:13:41 UTC'
  termsOfService: https://actionstreamer.com/terms-of-use
  contact:
    name: Contact
    url: https://actionstreamer.com/company
  version: v1
tags:
- name: Event
paths:
  /v1/event/dequeue:
    post:
      tags:
      - Event
      summary: Dequeues the next pending event for a device agent
      description: 'Request body: JSON object. Accepts either

        `deviceSerial` or `deviceName`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DequeueEvent'
            example:
              deviceName: WearableDevice
              deviceSerial: '10001234'
              agentType: Device
              agentIndex: 1
              processID: 4321
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                key: 501
                deviceID: 201
                agentTypeID: 1
                agentID: 1
                eventTypeID: 1
                serverEvent: 1
                eventStatus: 1
                eventParameters: '{"presetName":"Run Event Preset"}'
                processID: 4321
                result: Example value
                percentComplete: 42.5
                priority: 1
                expirationEpoch: 1711800000
                attemptNumber: 1
                maxAttempts: 3
                tagString: Example value
                tagNumber: 1
                creationDate: '2026-03-30T12:00:00.0000000Z'
      operationId: postV1EventDequeue
      x-operation-id-source: derived
  /v1/event:
    post:
      tags:
      - Event
      summary: Creates an event
      description: 'Request body: JSON object. Supports either

        `deviceSerial` or `deviceID`, either agent and event names or their numeric IDs,

        and optional fields such as `serverEvent`, `eventParameters`, `priority`,

        `maxAttempts`, and `expirationEpoch`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvent'
            example:
              deviceID: 201
              deviceSerial: '10001234'
              agentType: Device
              eventType: Run
              agentTypeID: 1
              eventTypeID: 1
              serverEvent: 1
              eventParameters: '{"presetName":"Run Event Preset"}'
              priority: 1
              maxAttempts: 3
              expirationEpoch: 1711800000
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResult'
              example:
                code: 1
                description: Example description
      operationId: postV1Event
      x-operation-id-source: derived
  /v1/event/{eventID}:
    get:
      tags:
      - Event
      summary: Gets an event by ID
      description: 'Returns a reduced event status payload.

        The response includes status details for the event.'
      parameters:
      - name: eventID
        in: path
        description: The ID of the event to retrieve.
        required: true
        style: simple
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventStatus'
              example:
                eventID: 501
                eventStatus: 1
                eventParameters: '{"presetName":"Run Event Preset"}'
                result: Example value
                percentComplete: 42.5
                priority: 1
                attemptNumber: 1
                maxAttempts: 3
                tagString: Example value
                tagNumber: 1
      operationId: getV1EventByEventID
      x-operation-id-source: derived
    put:
      tags:
      - Event
      summary: Updates an event
      description: 'Request body: JSON object. Only non-null fields from the request are applied.'
      parameters:
      - name: eventID
        in: path
        description: The ID of the event to update.
        required: true
        style: simple
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEvent'
            example:
              eventStatus: 1
              attemptNumber: 1
              result: Example value
              processID: 4321
              percentComplete: 42.5
              tagString: Example value
              tagNumber: 1
        required: true
      responses:
        '200':
          description: Success. No response body.
      operationId: putV1EventByEventID
      x-operation-id-source: derived
  /v1/event/status:
    patch:
      tags:
      - Event
      summary: Updates event status fields
      description: 'Request body: JSON object. Updates the

        `EventStatus` field for each event ID in the `events` list for the specified device.

        The device can be identified by `deviceID` or by `deviceName`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventStatus'
            example:
              deviceID: 201
              deviceName: WearableDevice
              eventStatus: 1
              events:
              - 1
        required: true
      responses:
        '200':
          description: Success. No response body.
      operationId: patchV1EventStatus
      x-operation-id-source: derived
  /v1/event/{eventID}/progress:
    patch:
      tags:
      - Event
      summary: Updates event progress fields
      description: 'Request body: JSON object. Patches only

        `PercentComplete` for the specified event.'
      parameters:
      - name: eventID
        in: path
        description: The ID of the event to patch.
        required: true
        style: simple
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventProgress'
            example:
              deviceName: WearableDevice
              deviceSerial: '10001234'
              percentComplete: 42.5
        required: true
      responses:
        '200':
          description: Success. No response body.
      operationId: patchV1EventByEventIDProgress
      x-operation-id-source: derived
  /v1/event/list:
    post:
      tags:
      - Event
      summary: Gets the event list
      description: 'Request body: JSON object. Set `deviceID` to return events

        for one device, or use `deviceID = 0` to get events for the authenticated user across devices.

        Supports an optional `updatedevice=true` query parameter.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateAndCountFilter'
            example:
              deviceID: 201
              startDate: '2026-03-30T12:00:00.0000000Z'
              endDate: '2026-03-30T12:00:00.0000000Z'
              count: 25
              order: Example value
        required: true
