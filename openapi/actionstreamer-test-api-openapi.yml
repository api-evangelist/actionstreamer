openapi: 3.2.0
info:
  title: ActionStreamer Test API
  description: 'A web API for the ActionStreamer platform. Publish date: 2026-07-07 16:13:41 UTC'
  termsOfService: https://actionstreamer.com/terms-of-use
  contact:
    name: Contact
    url: https://actionstreamer.com/company
  version: v1
tags:
- name: Test
paths:
  /v1/testauth:
    post:
      tags:
      - Test
      summary: Tests an authenticated API call
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1Testauth
      x-operation-id-source: derived
  /v1/test:
    get:
      tags:
      - Test
      summary: Tests an anonymous API call
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                Message: Success
      operationId: getV1Test
      x-operation-id-source: derived
  /v1/testapicall:
    post:
      tags:
      - Test
      summary: Tests an outbound API call
      description: Requires authentication and can return a throttling response when request limits are exceeded.
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1Testapicall
      x-operation-id-source: derived
