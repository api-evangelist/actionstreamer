paths:
  /v1/moq/publish-credential:
    post:
      tags:
      - MoQ
      summary: Creates a short-lived MoQ publish credential for a StreamSession
      description: 'Request body: JSON object with `streamID`, `streamSessionID`, `mediaServerID`, `sourceDeviceID`, and `sourceDeviceSerial`.

        Returns a relay URL, opaque namespace, JWT, and expiration timestamp for MoQ publish access.'
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1MoqPublishCredential
      x-operation-id-source: derived
  /v1/moq/subscribe-credential:
    post:
      tags:
      - MoQ
      summary: Creates a short-lived read-only MoQ credential for an authorized active…
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1MoqSubscribeCredential
      x-operation-id-source: derived
