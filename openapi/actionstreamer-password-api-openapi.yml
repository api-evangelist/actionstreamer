openapi: 3.2.0
info:
  title: ActionStreamer Password API
  description: 'A web API for the ActionStreamer platform. Publish date: 2026-07-07 16:13:41 UTC'
  termsOfService: https://actionstreamer.com/terms-of-use
  contact:
    name: Contact
    url: https://actionstreamer.com/company
  version: v1
tags:
- name: Password
paths:
  /v1/password:
    post:
      tags:
      - Password
      summary: Changes the authenticated user password
      description: 'Requires an authenticated web session.

        Request body: JSON object with `currentPassword` and `newPassword`.'
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1Password
      x-operation-id-source: derived
  /v1/forgotpassword:
    post:
      tags:
      - Password
      summary: Starts the forgot-password flow
      description: 'Request body: JSON object with the email address in `value`.

        If an account is found, the endpoint sends a password reset email.'
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1Forgotpassword
      x-operation-id-source: derived
  /v1/resetpassword:
    post:
      tags:
      - Password
      summary: Resets a user password
      description: 'Request body: JSON object with `token` and `newPassword`.'
      responses:
        '200':
          description: Success. No response body.
      operationId: postV1Resetpassword
      x-operation-id-source: derived
