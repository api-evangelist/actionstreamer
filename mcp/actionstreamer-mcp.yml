derivation_note: >-
  Tools are a curated read-first subset of the 247 published operations, chosen for the flows the
  provider's own quickstart and sample code highlight (get_device, run_event_preset). Every `rest`
  value is a verbatim method+path from the published contract. The contract declares no
  operationIds, so operations are referenced by method and path.
recommendations:
- >-
  If ActionStreamer ships an MCP server, gate every write tool behind confirmation and add an
  Idempotency-Key to the underlying API first — the write surface actuates physical hardware.
- >-
  Declare securitySchemes in the OpenAPI before generating any tool surface from it; today a
  generated MCP server would emit unauthenticated calls.
