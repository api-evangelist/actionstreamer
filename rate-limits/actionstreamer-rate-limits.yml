operational_note: >-
  The absence matters more than usual here. POST /v1/event/list/pending/longpoll is a long-poll
  endpoint that clients are expected to call continuously per device, and the errors guide instructs
  integrators to wrap long-poll and upload workflows in retries. A fleet operator building against
  this API has no published guidance on how many concurrent long-polls or uploads a key may sustain,
  and no runtime signal telling them when they are near a ceiling.
recommendations:
- Publish per-key and per-account limits, especially for the long-poll and media-upload endpoints.
- Return RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9331 style) and Retry-After on 429.
- Declare a 429 response in the OpenAPI.
