recommendations:
- Serve /.well-known/security.txt (RFC 9116) on actionstreamer.com naming a security contact and policy
  — the company currently publishes no machine-readable vulnerability-reporting address.
- Serve /.well-known/api-catalog (RFC 9727) pointing at the ActionStreamer apis.json / OpenAPI so agents
  and crawlers can discover the Web API from the root domain.
- Return 404 rather than the SPA shell for unmatched /.well-known/* paths on developer. and portal., so
  that discovery clients can distinguish absent from present.
